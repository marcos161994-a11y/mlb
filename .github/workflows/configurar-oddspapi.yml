# Guarda la API key de OddsPapi en el disco persistente de Render.
# Más fácil desde el móvil que editar Environment (que a menudo queda truncada).
#
# GitHub → Actions → Configurar OddsPapi → Run workflow → pega la key → Run.
name: Configurar OddsPapi

on:
  workflow_dispatch:
    inputs:
      oddspapi_key:
        description: "API key completa de oddspapi.io (UUID ~36 caracteres)"
        required: true
        type: string

jobs:
  set-key:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Guardar key en Render
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ODDSPAPI_KEY: ${{ inputs.oddspapi_key }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Falta CRON_SECRET en GitHub Secrets (mismo valor que en Render)."
            exit 1
          fi
          KEY="$(printf '%s' "$ODDSPAPI_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          LEN=${#KEY}
          echo "Key length recibida: $LEN"
          if [ "$LEN" -lt 20 ]; then
            echo "::error::Key demasiado corta ($LEN). Pega la UUID completa (~36)."
            exit 1
          fi
          RESP="$(curl -fsS --max-time 90 -X POST \
            "https://mlb-1-en7i.onrender.com/api/configurar-oddspapi?secret=${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json,os; print(json.dumps({"key": os.environ["ODDSPAPI_KEY"].strip()}))')")"
          echo "$RESP" | python3 -m json.tool
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('ok') is True, d; print('OK partidos=', d.get('partidos'), d.get('key_fingerprint'))"
