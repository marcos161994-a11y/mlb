# Guarda la API key de OddsPapi en el disco persistente de Render.
# Más fácil desde el móvil que editar Environment (que a menudo queda truncada).
#
# Pasos:
# 1) En https://oddspapi.io revoca la key vieja y crea una NUEVA (UUID ~36).
# 2) GitHub → Actions → Configurar OddsPapi → Run workflow → pega la key → Run.
# 3) (Recomendado) En Render → Environment borra ODDSPAPI_API_KEY vieja.
#    La key del disco ya tiene prioridad; borrar la env evita confusiones.
name: Configurar OddsPapi

on:
  workflow_dispatch:
    inputs:
      oddspapi_key:
        description: "API key NUEVA de oddspapi.io (UUID ~36 caracteres). No reuses la filtrada."
        required: true
        type: string

jobs:
  set-key:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Guardar key en Render
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ODDSPAPI_KEY: ${{ inputs.oddspapi_key }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Falta CRON_SECRET en GitHub Secrets (mismo valor que en Render)."
            exit 1
          fi
          KEY="$(printf '%s' "$ODDSPAPI_KEY" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          LEN=${#KEY}
          echo "Key length recibida: $LEN"
          if [ "$LEN" -lt 20 ]; then
            echo "::error::Key demasiado corta ($LEN). Pega la UUID completa (~36)."
            exit 1
          fi
          # Despierta Render (plan free)
          curl -fsS --retry 3 --retry-delay 10 --max-time 120 \
            "https://mlb-1-en7i.onrender.com/api/health" >/dev/null || true
          RESP="$(curl -fsS --max-time 90 -X POST \
            "https://mlb-1-en7i.onrender.com/api/configurar-oddspapi?secret=${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json,os; print(json.dumps({"key": os.environ["ODDSPAPI_KEY"].strip()}))')")"
          echo "$RESP" | python3 -m json.tool
          echo "$RESP" | python3 -c '
          import sys, json
          d = json.load(sys.stdin)
          g = d.get("guardado") or {}
          p = d.get("probe") or {}
          print("guardado_ok=", d.get("guardado_ok", g.get("ok")))
          print("oddspapi_ok=", d.get("oddspapi_ok"))
          print("http_status=", d.get("http_status") or p.get("http_status"))
          print("fingerprint=", d.get("key_fingerprint") or g.get("key_fingerprint"))
          print("error_api=", d.get("error_api") or p.get("error_api"))
          if g.get("aviso_env"):
              print("AVISO:", g.get("aviso_env"))
          if d.get("espn_fallback"):
              print("INFO:", d.get("espn_fallback"))
          if not g.get("ok"):
              raise SystemExit("No se pudo guardar la key en Render (revisa CRON_SECRET / servidor).")
          if not d.get("oddspapi_ok"):
              print("::warning::Key guardada pero OddsPapi rechazó la key (401/plan). ESPN sigue activo.")
              print("ayuda:", d.get("ayuda"))
          else:
              print("OK key guardada y OddsPapi aceptó la key.")
          '
