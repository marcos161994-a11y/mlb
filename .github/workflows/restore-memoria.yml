# Sube memoria_auditoria.json del repo a Render (recuperación tras wipe).
# Fusiona días; no pisa el historial más nuevo del disco.
# Manual: Actions → Restore memoria Render → Run workflow
# (automático al arrancar el servidor + cron + /api/health)
name: Restore memoria Render

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Subir memoria a Render (fusionar)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta CRON_SECRET en GitHub Secrets (mismo valor que Render)."
            exit 1
          fi
          echo "Fusionando memoria_auditoria.json en Render..."
          curl -fsS --retry 3 --retry-delay 10 --max-time 120 \
            -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @"memoria_auditoria.json" \
            "https://mlb-1-en7i.onrender.com/api/subir-memoria?secret=${CRON_SECRET}&modo=fusionar"
          echo
          echo "Verificando..."
          curl -fsS --max-time 60 "https://mlb-1-en7i.onrender.com/api/predicciones" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('dias', [(x.get('fecha'), len(x.get('predicciones') or [])) for x in d.get('historial') or []])"
          echo
