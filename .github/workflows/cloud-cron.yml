# Mantiene Quantum MLB en Render despierto, congela T-60 y liquida cada 5 min.
# Requiere: secret CRON_SECRET en GitHub (mismo valor que en Render).
name: MLB Cloud Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Prioridad: variable de repo RENDER_URL, luego secret RENDER_URL,
# y si no hay ninguno el servicio vivo (mlb-u9rd). mlb-1-en7i es otro servicio.
env:
  RENDER_URL: ${{ vars.RENDER_URL || secrets.RENDER_URL || 'https://mlb-u9rd.onrender.com' }}

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Normalizar RENDER_URL
        run: |
          url="${RENDER_URL:-https://mlb-u9rd.onrender.com}"
          url="${url%/}"
          echo "RENDER_URL=${url}" >> "$GITHUB_ENV"
          echo "Servicio: ${url}"

      - name: Health (despierta Render)
        run: curl -fsS --retry 3 --retry-delay 15 --max-time 120 "${RENDER_URL}/api/health"

      - name: Verificar cuotas de mercado
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Falta CRON_SECRET — no se verifica odds-status."
            exit 0
          fi
          body=$(curl -fsS --max-time 90 \
            "${RENDER_URL}/api/odds-status" || echo '{"ok":false}')
          echo "$body"
          ok=$(echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); print('1' if d.get('ok') else '0')" 2>/dev/null || echo 0)
          if [ "$ok" != "1" ]; then
            echo "::warning::Cuotas de mercado no OK — revisa ESPN/DraftKings."
          fi

      - name: Iniciar cron en segundo plano (respuesta rapida)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta CRON_SECRET en GitHub Secrets (mismo valor que Render)."
            exit 1
          fi
          # Header (preferido) y query (servidor anterior al deploy de auth).
          curl -fsS --max-time 60 \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            "${RENDER_URL}/api/auto-bloqueo-externo?secret=${CRON_SECRET}&en_fondo=1"
      # El import 9 MB + ML ya lo hace el cron al final si hace falta.
      # Pegarlo aquí en paralelo era el pico que tumba Render free (512 MB).
