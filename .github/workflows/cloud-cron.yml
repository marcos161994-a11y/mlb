# Mantiene Quantum MLB en Render despierto, congela en T-90/T-60/T-30/T-10 y liquida cada 5 min.
# Primero despierta el servicio (reintentos) y luego llama al congelado, también con reintento.
# Requiere: secret CRON_SECRET en GitHub (mismo valor que en Render).
name: MLB Cloud Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Prioridad: variable de repo RENDER_URL, luego secret RENDER_URL,
# y si no hay ninguno el servicio vivo mlb-1 (tiene CRON_SECRET).
env:
  RENDER_URL: ${{ vars.RENDER_URL || secrets.RENDER_URL || 'https://mlb-1-en7i.onrender.com' }}

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Normalizar RENDER_URL
        run: |
          url="${RENDER_URL:-https://mlb-1-en7i.onrender.com}"
          url="${url%/}"
          echo "RENDER_URL=${url}" >> "$GITHUB_ENV"
          echo "Servicio: ${url}"

      - name: Despertar servicio (reintentos antes de congelar)
        run: |
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "Calentamiento ${i}: ${RENDER_URL}/api/health"
            if curl -fsS --retry 2 --retry-all-errors --retry-delay 5 --max-time 50 \
                "${RENDER_URL}/api/health" -o /tmp/mlb-health.json; then
              echo "Health OK intento ${i}"
              ok=1
              break
            fi
            echo "Servicio dormido o arrancando; espero 20s"
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::mlb-1 no respondió tras el calentamiento"
            exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/mlb-health.json", encoding="utf-8"))
          c = d.get("congelacion") or {}
          n = int(c.get("ventanas_perdidas") or 0)
          print(
              "ventanas_perdidas="
              + str(n)
              + " recuperadas="
              + str(c.get("ventanas_recuperadas"))
          )
          if n:
              print(
                  "::warning::Congelación: "
                  + str(n)
                  + " partido(s) se quedaron sin pick antes del primer lanzamiento"
              )
          PY

      - name: Verificar cuotas de mercado
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Falta CRON_SECRET — no se verifica odds-status."
            exit 0
          fi
          body=$(curl -fsS --max-time 90 \
            "${RENDER_URL}/api/odds-status" || echo '{"ok":false}')
          echo "$body"
          ok=$(echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); print('1' if d.get('ok') else '0')" 2>/dev/null || echo 0)
          if [ "$ok" != "1" ]; then
            echo "::warning::Cuotas de mercado no OK — revisa ESPN/DraftKings."
          fi

      - name: Iniciar cron en segundo plano (respuesta rapida)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta CRON_SECRET en GitHub Secrets (mismo valor que Render)."
            exit 1
          fi
          # Header (preferido) y query (servidor anterior al deploy de auth).
          # Si el free todavía está despertando, se vuelve a calentar y se reintenta.
          ok=0
          for i in 1 2 3; do
            if curl -fsS --retry 2 --retry-all-errors --retry-delay 5 --max-time 90 \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              "${RENDER_URL}/api/auto-bloqueo-externo?secret=${CRON_SECRET}&en_fondo=1"; then
              echo "Congelado aceptado intento ${i}"
              ok=1
              break
            fi
            echo "Llamada de congelación falló (intento ${i}). Vuelvo a despertar."
            curl -fsS --retry 2 --retry-all-errors --retry-delay 5 --max-time 50 \
              "${RENDER_URL}/api/health" >/dev/null || true
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::No se pudo llamar al congelado tras reintentos"
            exit 1
          fi
      # El import 9 MB + ML ya lo hace el cron al final si hace falta.
      # Pegarlo aquí en paralelo era el pico que tumba Render free (512 MB).
