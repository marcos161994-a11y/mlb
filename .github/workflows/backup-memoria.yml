# Backup automático de memoria_auditoria.json desde Render → GitHub.
# Fusiona (nunca pisa) para que un wipe en vivo no borre días viejos del repo.
# Requiere: secret CRON_SECRET (igual que en Render).
# El schedule solo corre cuando este archivo está en la rama default (main).
name: Backup memoria Render

on:
  schedule:
    # Cada 2 h + 4:00 / 14:00 / 23:30 hora Puerto Rico (UTC-4)
    - cron: "0 */2 * * *"
    - cron: "0 8 * * *"
    - cron: "0 18 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:

# Prioridad: variable de repo RENDER_URL, luego secret RENDER_URL,
# y si no hay ninguno el servicio vivo (mlb-u9rd). mlb-1-en7i es otro servicio.
env:
  RENDER_URL: ${{ vars.RENDER_URL || secrets.RENDER_URL || 'https://mlb-u9rd.onrender.com' }}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Normalizar RENDER_URL
        run: |
          url="${RENDER_URL:-https://mlb-u9rd.onrender.com}"
          url="${url%/}"
          echo "RENDER_URL=${url}" >> "$GITHUB_ENV"
          echo "Servicio: ${url}"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Descargar memoria desde Render
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta CRON_SECRET en GitHub Secrets (mismo valor que Render)."
            exit 1
          fi

          curl -fsS --retry 4 --retry-delay 15 --max-time 120 \
            "${RENDER_URL}/api/health" >/dev/null

          echo "Fuente: /api/exportar-memoria"
          # Header (preferido) y query (servidor anterior al deploy de auth).
          curl -fsS --retry 3 --retry-delay 10 --max-time 120 \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            "${RENDER_URL}/api/exportar-memoria?secret=${CRON_SECRET}" \
            -o /tmp/memoria_live.json

          python3 - <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path("/tmp/memoria_live.json").read_text(encoding="utf-8")
          data = json.loads(raw)
          if not isinstance(data, dict) or "capital" not in data or "dias" not in data:
              print("Respuesta invalida:", raw[:300])
              sys.exit(1)
          print(
              f"Live dia={data.get('dia_actual')} capital={data.get('capital')} "
              f"dias={len(data.get('dias') or [])}"
          )
          PY

          # NUNCA pisar: unir repo + vivo. Si falta el script, abortar (no borrar historial).
          if [ ! -f memoria_fusion.py ]; then
            echo "::error::Falta memoria_fusion.py — no se sobrescribe el historial del repo."
            exit 1
          fi
          BEFORE=$(python3 -c "import json; d=json.load(open('memoria_auditoria.json')); print(len([x for x in d.get('dias') or [] if x.get('predicciones') or x.get('apuestas')]))")
          python3 memoria_fusion.py memoria_auditoria.json /tmp/memoria_live.json memoria_auditoria.json
          AFTER=$(python3 -c "import json; d=json.load(open('memoria_auditoria.json')); print(len([x for x in d.get('dias') or [] if x.get('predicciones') or x.get('apuestas')]))")
          if [ "$AFTER" -lt "$BEFORE" ]; then
            echo "::error::Fusion perdería días ($BEFORE -> $AFTER). Abortando."
            exit 1
          fi
          echo "Backup OK: días con historial $BEFORE -> $AFTER"

      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memoria_auditoria.json
          if git diff --staged --quiet; then
            echo "Sin cambios en memoria."
            exit 0
          fi
          DIA=$(python3 -c "import json; print(json.load(open('memoria_auditoria.json')).get('dia_actual'))")
          CAP=$(python3 -c "import json; print(json.load(open('memoria_auditoria.json')).get('capital'))")
          git commit -m "backup(memoria): dia ${DIA} capital ${CAP}"
          git push origin main
