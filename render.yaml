# Blueprint Render.com — Quantum MLB 24/7
# En Render: New > Blueprint > conecta tu repo con este archivo

services:
  - type: web
    name: quantum-mlb
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      # numpy==2.5.3 y xgboost==3.4.1 exigen Python >= 3.12.
      # Tiene que ser versión completa (3.12.14, no 3.12).
      # Si el dashboard ya define PYTHON_VERSION, ese valor pisa este blueprint.
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: ODDS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Mismo valor en GitHub → Settings → Secrets → Actions → CRON_SECRET.
      # Sin esta variable el servidor rechaza liquidar, bloquear, reiniciar e importar.
      - key: CRON_SECRET
        generateValue: true
      # Postgres (Neon, Supabase o Render). Sin esta variable el plan free
      # guarda en SQLite sobre un disco que se borra al reiniciar.
      # Pega la connection string. Si el host es externo y no trae sslmode,
      # el servidor añade sslmode=require. La URL interna de Render (host sin
      # punto, dpg-…) no lleva SSL.
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: /var/data
